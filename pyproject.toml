[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "p16-trigger-comparison"
version = "0.1.0"
description = "Educational comparison of image backdoor trigger forms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "Pillow",
]

[project.optional-dependencies]
train = [
    "jupyterlab",
    "matplotlib",
    "pandas",
    "PyYAML",
    "scikit-image",
    "seaborn",
    "torch",
    "torchvision",
]
dev = [
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
